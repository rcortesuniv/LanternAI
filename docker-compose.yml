name: lantern-ai

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ollama__BaseUrl: https://ollama.com
      Ollama__Model: qwen3.5:397b
      Ollama__ApiKey: ${OLLAMA_API_KEY:?Set OLLAMA_API_KEY before starting Docker Compose}
      Cors__AllowedOrigins__0: http://localhost:5173

  # Dev-mode frontend container (Vite dev server with hot reload). The
  # browser runs on the host, so VITE_API_BASE_URL points at the
  # host-mapped backend port, not the in-network service name.
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5020
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  frontend-node-modules:
