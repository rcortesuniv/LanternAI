name: lantern-ai

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "5020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: qwen2.5-coder:1.5b
      Cors__AllowedOrigins__0: http://localhost:5173
    depends_on:
      ollama:
        condition: service_healthy

  # Dev-mode frontend container (Vite dev server with hot reload). The
  # browser runs on the host, so VITE_API_BASE_URL points at the
  # host-mapped backend port, not the in-network service name.
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5020
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  ollama-data:
  frontend-node-modules:
